<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalSpot · Bump Edition</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
    <style>
        :root {
            --primary: #2563eb; --bg: #f4f6f8; --surface: #ffffff; --border: #e1e5ea;
            --text: #18212b; --muted: #6b7380; --header-h: 64px;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .hidden { display: none !important; }

        /* Header */
        .header { height: var(--header-h); background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0; z-index: 10; }
        .logo { font-weight: bold; font-size: 20px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        nav { display: flex; gap: 16px; align-items: center; }
        .btn-soft { border: none; background: #eef3ff; color: var(--primary); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-link { background: none; border: none; cursor: pointer; color: var(--text); font-weight: 500; font-size: 14px; }
        .btn-link.active { color: var(--primary); font-weight: bold; }

        /* Layout */
        .main { display: flex; flex: 1; overflow: hidden; position: relative; }
        .sidebar { width: 360px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 5; overflow-y: auto; }
        .sidebar-content { padding: 20px; }
        .sidebar-footer { padding: 20px; border-top: 1px solid var(--border); margin-top: auto; }

        /* MAPA - Correção Crítica */
        .map-container { flex: 1; position: relative; background: #e5e7eb; }
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* UI Elements */
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; font-family: inherit; }
        .submit-button { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .modal-content { background: #fff; padding: 24px; border-radius: 12px; width: 100%; max-width: 400px; position: relative; }
        .close-button { position: absolute; right: 15px; top: 15px; font-size: 24px; background: none; border: none; cursor: pointer; }

        /* Pin do Mapa */
        .pin { width: 20px; height: 20px; background: var(--primary); border: 2px solid white; border-radius: 50%; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }

        /* Chat */
        #chatMessages { height: 250px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; background: #fafafa; border-radius: 8px; }
        .msg { padding: 8px 12px; border-radius: 12px; max-width: 80%; font-size: 14px; }
        .msg.me { align-self: flex-end; background: var(--primary); color: white; }
        .msg.other { align-self: flex-start; background: #eee; color: black; }
        .friend-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">📍 LocalSpot <span style="font-size:12px; background:#eef3ff; padding:2px 6px; border-radius:4px;">Bump</span></div>
        <nav>
            <button id="tabMapBtn" class="btn-link active">🗺️ Mapa</button>
            <button id="tabSocialBtn" class="btn-link">👥 Amigos & Chat</button>
            <button id="authBtn" class="btn-soft">Entrar</button>
        </nav>
    </header>

    <main class="main">
        <!-- Sidebar -->
        <aside class="sidebar">
            <!-- Vista Social (Amigos/Chat) -->
            <div id="socialView" class="hidden" style="display:flex; flex-direction:column; height:100%;">
                <div class="sidebar-content" style="flex:1; overflow-y:auto;">
                    <h3>Procurar Amigos</h3>
                    <div style="display:flex; gap:5px;">
                        <input type="text" id="searchUserInput" placeholder="Username...">
                        <button id="searchUserBtn" class="btn-soft" style="margin-bottom:10px;">🔍</button>
                    </div>
                    <div id="searchResults" style="margin-bottom:20px;"></div>

                    <h3>Os Meus Amigos</h3>
                    <div id="friendsList"></div>
                </div>
            </div>

            <!-- Vista Mapa (Locais) -->
            <div id="mapView" style="display:flex; flex-direction:column; height:100%;">
                <div class="sidebar-content">
                    <h3>Locais Perto de Ti</h3>
                    <p style="font-size:13px; color:var(--muted);">Clica no mapa para adicionar um local.</p>
                    <div id="placesList" style="margin-top:15px;"></div>
                </div>
                <div class="sidebar-footer">
                    <button id="ghostModeBtn" class="submit-button" style="background:#6b7380;">👻 Ghost Mode</button>
                </div>
            </div>
        </aside>

        <!-- Mapa -->
        <section class="map-container">
            <div id="map"></div>
        </section>
    </main>

    <!-- Modal de Autenticação -->
    <div id="authModal" class="modal hidden">
        <div class="modal-content">
            <button class="close-button" onclick="document.getElementById('authModal').classList.add('hidden')">×</button>
            <h2 id="authTitle">Entrar</h2>
            <form id="authForm">
                <input type="text" id="authUsername" placeholder="Username (só no registo)" class="hidden">
                <input type="email" id="authEmail" placeholder="Email" required>
                <input type="password" id="authPassword" placeholder="Palavra-passe" required>
                <button type="submit" id="authSubmitBtn" class="submit-button">Entrar</button>
            </form>
            <p style="text-align:center; margin-top:10px; font-size:14px;">
                <a href="#" id="toggleAuth" style="color:var(--primary);">Criar conta</a>
            </p>
        </div>
    </div>

    <!-- Modal de Chat -->
    <div id="chatModal" class="modal hidden">
        <div class="modal-content">
            <button class="close-button" onclick="document.getElementById('chatModal').classList.add('hidden')">×</button>
            <h2 id="chatTitle">Chat</h2>
            <div id="chatMessages"></div>
            <form id="chatForm" style="display:flex; gap:5px;">
                <input type="text" id="chatInput" placeholder="Mensagem..." style="margin:0;">
                <button type="submit" class="btn-soft">Enviar</button>
            </form>
        </div>
    </div>

    <!-- SDKs -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

    <script>
        // ==========================================
        // CONFIGURAÇÃO - SUBSTITUI AQUI!
        // ==========================================
        const SUPABASE_URL = 'https://O_TEU_PROJETO.supabase.co';
        const SUPABASE_ANON_KEY = 'A_TUA_ANON_KEY';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ==========================================
        // ESTADO GLOBAL
        // ==========================================
        let currentUser = null;
        let userPosition = null;
        let currentChatRoomId = null;
        let isRegisterMode = false;
        const $ = id => document.getElementById(id);

        // ==========================================
        // INICIALIZAÇÃO DO MAPA (SATÉLITE)
        // ==========================================
        const map = new maplibregl.Map({
            container: 'map',
            style: {
                version: 8,
                sources: {
                    satellite: {
                        type: 'raster',
                        tiles: ['https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg'],
                        tileSize: 256
                    }
                },
                layers: [{ id: 'satellite', type: 'raster', source: 'satellite' }]
            },
            center: [-8.0, 39.6],
            zoom: 6
        });
        map.addControl(new maplibregl.NavigationControl());

        // Marcador do Utilizador
        const userMarker = new maplibregl.Marker({ color: '#2563eb' }).setLngLat([-8.0, 39.6]).addTo(map);

        // Adicionar Local ao clicar no mapa
        map.on('click', async (e) => {
            if (!currentUser) return alert("Faz login para adicionar locais.");
            const lat = e.lngLat.lat;
            const lng = e.lngLat.lng;
            
            new maplibregl.Marker().setLngLat([lng, lat]).addTo(map);
            
            const { error } = await supabase.from('places').insert({
                name: `Local (${lat.toFixed(2)}, ${lng.toFixed(2)})`,
                latitude: lat,
                longitude: lng,
                created_by: currentUser.id
            });
            if (error) alert("Erro ao guardar local: " + error.message);
            else loadPlaces();
        });

        // ==========================================
        // AUTENTICAÇÃO
        // ==========================================
        $("authBtn").addEventListener("click", () => $("authModal").classList.remove("hidden"));
        $("toggleAuth").addEventListener("click", (e) => {
            e.preventDefault();
            isRegisterMode = !isRegisterMode;
            $("authTitle").textContent = isRegisterMode ? "Criar Conta" : "Entrar";
            $("authUsername").classList.toggle("hidden", !isRegisterMode);
            $("authSubmitBtn").textContent = isRegisterMode ? "Registar" : "Entrar";
        });

        $("authForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = $("authEmail").value;
            const pass = $("authPassword").value;
            
            if (isRegisterMode) {
                const { error } = await supabase.auth.signUp({ 
                    email, 
                    password: pass, 
                    options: { data: { username: $("authUsername").value } } 
                });
                if (error) alert(error.message); 
                else { alert("Registado! Já podes entrar."); $("toggleAuth").click(); }
            } else {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });
                if (error) alert(error.message); 
                else { 
                    currentUser = data.user; 
                    $("authBtn").textContent = "Sair"; 
                    $("authBtn").onclick = async () => { await supabase.auth.signOut(); location.reload(); };
                    $("authModal").classList.add("hidden"); 
                    loadFriends();
                    loadPlaces();
                }
            }
        });

        // ==========================================
        // FUNÇÕES BUMP: AMIGOS E CHAT
        // ==========================================
        async function loadFriends() {
            if (!currentUser) return;
            const { data } = await supabase.from('friends')
                .select('friend_id, profiles:friend_id(username)')
                .eq('user_id', currentUser.id);
            
            if (data) {
                $("friendsList").innerHTML = data.map(f => `
                    <div class="friend-item">
                        <span>👤 ${f.profiles.username}</span>
                        <button class="btn-soft" onclick="openChat('${f.friend_id}')">💬</button>
                    </div>
                `).join("") || "<p style='font-size:13px; color:#666;'>Ainda não tens amigos.</p>";
            }
        }

        $("searchUserBtn").addEventListener("click", async () => {
            const q = $("searchUserInput").value;
            if (!q || !currentUser) return;
            const { data } = await supabase.from('profiles')
                .select('id, username')
                .ilike('username', `%${q}%`)
                .neq('id', currentUser.id);
            
            if (data) {
                $("searchResults").innerHTML = data.map(u => `
                    <div class="friend-item">
                        <span>${u.username}</span>
                        <button class="btn-soft" onclick="addFriend('${u.id}')">Adicionar</button>
                    </div>
                `).join("");
            }
        });

        window.addFriend = async (friendId) => {
            await supabase.from('friends').insert({ user_id: currentUser.id, friend_id: friendId });
            await supabase.from('friends').insert({ user_id: friendId, friend_id: currentUser.id });
            alert("Amigo adicionado!");
            loadFriends();
            $("searchResults").innerHTML = "";
        };

        // CHAT
        window.openChat = async (friendId) => {
            // Verificar ou criar sala
            let { data: room } = await supabase.from('chat_rooms').select('id').limit(1).maybeSingle();
            // Simplificação: cria sempre nova sala para teste
            const { data: newRoom } = await supabase.from('chat_rooms').insert({}).select().single();
            await supabase.from('chat_participants').insert([
                { room_id: newRoom.id, user_id: currentUser.id },
                { room_id: newRoom.id, user_id: friendId }
            ]);
            currentChatRoomId = newRoom.id;
            $("chatModal").classList.remove("hidden");
            loadMessages();
        };

        async function loadMessages() {
            if (!currentChatRoomId) return;
            const { data } = await supabase.from('chat_messages')
                .select('*, profiles:sender_id(username)')
                .eq('room_id', currentChatRoomId)
                .order('created_at');
            
            if (data) {
                $("chatMessages").innerHTML = data.map(m => `
                    <div class="msg ${m.sender_id === currentUser.id ? 'me' : 'other'}">
                        <strong>${m.profiles.username}</strong><br>${m.content}
                    </div>
                `).join("");
                $("chatMessages").scrollTop = $("chatMessages").scrollHeight;
            }
        }

        $("chatForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const content = $("chatInput").value;
            if (!content || !currentChatRoomId) return;
            await supabase.from('chat_messages').insert({
                room_id: currentChatRoomId,
                sender_id: currentUser.id,
                content: content
            });
            $("chatInput").value = "";
            loadMessages();
        });

        // ==========================================
        // FUNÇÕES DE LOCALIZAÇÃO E LOCAIS
        // ==========================================
        async function loadPlaces() {
            const { data } = await supabase.from('places').select('*');
            if (data) {
                $("placesList").innerHTML = data.map(p => `
                    <div style="padding:10px; border-bottom:1px solid #eee; font-size:14px;">
                        📍 ${p.name}
                    </div>
                `).join("");
            }
        }

        async function updateLocation() {
            if (!navigator.geolocation || !currentUser) return;
            navigator.geolocation.watchPosition(async (pos) => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                userPosition = { lat, lng };
                userMarker.setLngLat([lng, lat]);
                
                await supabase.from('profiles').update({ latitude: lat, longitude: lng, last_seen: new Date() }).eq('id', currentUser.id);
            }, (err) => console.error(err), { enableHighAccuracy: true });
        }

        $("ghostModeBtn").addEventListener("click", async () => {
            if (!currentUser) return alert("Faz login.");
            const { data } = await supabase.from('profiles').select('ghost_mode').eq('id', currentUser.id).single();
            const newMode = !data.ghost_mode;
            await supabase.from('profiles').update({ ghost_mode: newMode }).eq('id', currentUser.id);
            alert(`Ghost Mode: ${newMode ? 'Ligado (invisível)' : 'Desligado (visível)'}`);
        });

        // ==========================================
        // TABS (Navegação)
        // ==========================================
        $("tabMapBtn").addEventListener("click", () => {
            $("mapView").classList.remove("hidden");
            $("socialView").classList.add("hidden");
            $("tabMapBtn").classList.add("active");
            $("tabSocialBtn").classList.remove("active");
        });
        $("tabSocialBtn").addEventListener("click", () => {
            if (!currentUser) return alert("Faz login para ver Amigos.");
            $("mapView").classList.add("hidden");
            $("socialView").classList.remove("hidden");
            $("tabSocialBtn").classList.add("active");
            $("tabMapBtn").classList.remove("active");
            loadFriends();
        });

        // ==========================================
        // ARRANQUE
        // ==========================================
        async function init() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                $("authBtn").textContent = "Sair";
                $("authBtn").onclick = async () => { await supabase.auth.signOut(); location.reload(); };
                loadFriends();
                loadPlaces();
                updateLocation();
            } else {
                // Tentar obter localização só para mostrar o mapa
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(pos => {
                        map.flyTo({ center: [pos.coords.longitude, pos.coords.latitude], zoom: 12 });
                        userMarker.setLngLat([pos.coords.longitude, pos.coords.latitude]);
                    });
                }
            }
        }

        init();
    </script>
</body>
</html>
